<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="William Oneka">
    <title>White Water Rafting Co. | Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting Co. for reservations, general inquiries, or website suggestions. Find our address, phone, email, and location map.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="White Water Rafting Co. logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact White Water Rafting Co.</h1>

        <!-- Company Info + Map -->
        <section class="contact-info">
            <h2>White Water Rafting Co.</h2>

            <p>Plot 93 Lower Churchill Drive,<br>
                Gulu, Uganda</p>
            <p>Phone: +256784764440</p>
            <p>Email: <a href="mailto:william.oneka1@gmail.com">william.oneka1@gmail.com</a></p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d7646.2822115444515!2d32.303550264326525!3d2.7796475513847354!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s!5e1!3m2!1sen!2sug!4v1790468121013!5m2!1sen!2sug"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="William Oneka, Head Guide">
                    <figcaption>William Oneka – Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="William Oneka, Safety Officer">
                    <figcaption>William Oneka – Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="William Oneka, Reservation Manager">
                    <figcaption>William Oneka – Reservation Manager</figcaption>
                </figure>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <div class="form-item">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset class="form-item">
                    <legend>Purpose of Message:</legend>

                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general"
                          required>
                        General Inquiry
                    </label>

                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">
                        Reservation Question
                    </label>

                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose"
                          value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Send My Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p> &copy; 2026 White Water Rafting Co. | William Oneka</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
